<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"
     role="img" aria-label="A video question whose four candidate answers are all wrong; the model commits to a distractor instead of abstaining">
  <defs>
<style>
    .s   { stroke:#8892a0; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .s2  { stroke:#8892a0; stroke-width:2; fill:none; stroke-linecap:round; opacity:.55 }
    .dash{ stroke:#8892a0; stroke-width:2.5; fill:none; stroke-dasharray:9 9; stroke-linecap:round; opacity:.6 }
    .a   { stroke:#3d8bf0; stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .adash{stroke:#3d8bf0; stroke-width:3; fill:none; stroke-dasharray:10 8; stroke-linecap:round }
    .gf  { fill:#8892a0; opacity:.20 }
    .gf2 { fill:#8892a0; opacity:.38 }
    .af  { fill:#3d8bf0; opacity:.26 }
    .af2 { fill:#3d8bf0; opacity:.85 }
    .wf  { fill:#d98b6a; opacity:.30 }
    .w   { stroke:#d98b6a; stroke-width:3; fill:none; stroke-linecap:round }
    .t   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#8892a0 }
    .ta  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#3d8bf0 }
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#8892a0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#3d8bf0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  </defs>

  <text class="t" x="70" y="90">VIDEO</text>

  <!-- film strip -->
  <g>
    <rect class="s" x="70" y="120" width="150" height="112" rx="8"/>
    <rect class="s" x="235" y="120" width="150" height="112" rx="8"/>
    <rect class="s" x="400" y="120" width="150" height="112" rx="8"/>
    <rect class="gf" x="86" y="150" width="118" height="14" rx="7"/>
    <rect class="gf" x="86" y="180" width="80" height="14" rx="7"/>
    <rect class="gf" x="251" y="150" width="100" height="14" rx="7"/>
    <rect class="gf" x="251" y="180" width="118" height="14" rx="7"/>
    <rect class="gf" x="416" y="150" width="90" height="14" rx="7"/>
    <rect class="gf" x="416" y="180" width="110" height="14" rx="7"/>
  </g>

  <!-- question -->
  <rect class="s" x="70" y="290" width="480" height="76" rx="12"/>
  <text class="t" x="98" y="340">Q</text>
  <rect class="gf" x="150" y="316" width="240" height="14" rx="7"/>
  <rect class="gf" x="150" y="340" width="170" height="14" rx="7"/>

  <path class="s" d="M600 328 L680 328" marker-end="url(#ar)"/>

  <!-- four options, every one wrong -->
  <g>
    <rect class="s2" x="720" y="120" width="410" height="72" rx="10"/>
    <rect class="s2" x="720" y="212" width="410" height="72" rx="10"/>
    <rect class="a"  x="720" y="304" width="410" height="72" rx="10"/>
    <rect class="af" x="730" y="314" width="390" height="52" rx="6"/>
    <rect class="s2" x="720" y="396" width="410" height="72" rx="10"/>

    <text class="t" x="752" y="166">A</text><text class="t" x="752" y="258">B</text>
    <text class="ta" x="752" y="350">C</text><text class="t" x="752" y="442">D</text>

    <g class="w">
      <path d="M1062 142 L1094 174 M1094 142 L1062 174"/>
      <path d="M1062 234 L1094 266 M1094 234 L1062 266"/>
      <path d="M1062 326 L1094 358 M1094 326 L1062 358"/>
      <path d="M1062 418 L1094 450 M1094 418 L1062 450"/>
    </g>
  </g>

  <text class="ta" x="720" y="530">MODEL PICKS C</text>

  <!-- the option it should have taken -->
  <rect class="dash" x="720" y="570" width="410" height="72" rx="10"/>
  <text class="t" x="752" y="616">NONE OF THE ABOVE</text>
  <path class="dash" d="M660 606 L710 606"/>
  <text class="t" x="70" y="616">SHOULD ABSTAIN</text>
</svg>
