<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"
     role="img" aria-label="Many conversation turns compressed into a few memory slots; one durable preference is retained, another is dropped">
  <defs>
<style>
    .s   { stroke:#8892a0; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .s2  { stroke:#8892a0; stroke-width:2; fill:none; stroke-linecap:round; opacity:.55 }
    .dash{ stroke:#8892a0; stroke-width:2.5; fill:none; stroke-dasharray:9 9; stroke-linecap:round; opacity:.6 }
    .a   { stroke:#3d8bf0; stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .adash{stroke:#3d8bf0; stroke-width:3; fill:none; stroke-dasharray:10 8; stroke-linecap:round }
    .gf  { fill:#8892a0; opacity:.20 }
    .gf2 { fill:#8892a0; opacity:.38 }
    .af  { fill:#3d8bf0; opacity:.26 }
    .af2 { fill:#3d8bf0; opacity:.85 }
    .wf  { fill:#d98b6a; opacity:.30 }
    .w   { stroke:#d98b6a; stroke-width:3; fill:none; stroke-linecap:round }
    .t   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#8892a0 }
    .ta  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#3d8bf0 }
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#8892a0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#3d8bf0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  </defs>

  <text class="t" x="70" y="92">CONVERSATION</text>
  <text class="ta" x="880" y="92">MEMORY</text>

  <!-- turn stack -->
  <g>
    <rect class="gf" x="70" y="130" width="300" height="34" rx="17"/>
    <rect class="gf" x="70" y="180" width="250" height="34" rx="17"/>
    <rect class="af" x="70" y="230" width="330" height="34" rx="17"/>
    <rect class="gf" x="70" y="280" width="220" height="34" rx="17"/>
    <rect class="gf" x="70" y="330" width="300" height="34" rx="17"/>
    <rect class="wf" x="70" y="380" width="270" height="34" rx="17"/>
    <rect class="gf" x="70" y="430" width="240" height="34" rx="17"/>
    <rect class="gf" x="70" y="480" width="310" height="34" rx="17"/>
    <rect class="gf" x="70" y="530" width="200" height="34" rx="17"/>
    <rect class="gf" x="70" y="580" width="280" height="34" rx="17"/>
  </g>

  <!-- funnel -->
  <path class="s" d="M470 150 L640 330 L640 420 L470 600"/>
  <path class="s2" d="M470 150 L470 600"/>

  <!-- compressed slots -->
  <rect class="s" x="880" y="150" width="250" height="70" rx="12"/>
  <rect class="s" x="880" y="250" width="250" height="70" rx="12"/>
  <rect class="a"  x="880" y="350" width="250" height="70" rx="12"/>
  <rect class="s" x="880" y="450" width="250" height="70" rx="12"/>
  <rect class="af" x="890" y="360" width="230" height="50" rx="8"/>

  <!-- retained preference travels through -->
  <path class="a" d="M410 247 C560 247 640 385 870 385" marker-end="url(#ara)"/>

  <!-- dropped preference falls out -->
  <path class="w" d="M355 397 C480 397 540 470 560 690"/>
  <circle cx="560" cy="710" r="13" fill="#d98b6a" opacity=".55"/>
  <text class="t" x="600" y="720" style="fill:#d98b6a">DROPPED</text>
</svg>
