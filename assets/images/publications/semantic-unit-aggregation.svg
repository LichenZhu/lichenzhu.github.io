<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"
     role="img" aria-label="Fixed temporal windows cut events in half, while semantic-unit segmentation keeps each event intact">
  <defs>
<style>
    .s   { stroke:#8892a0; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .s2  { stroke:#8892a0; stroke-width:2; fill:none; stroke-linecap:round; opacity:.55 }
    .dash{ stroke:#8892a0; stroke-width:2.5; fill:none; stroke-dasharray:9 9; stroke-linecap:round; opacity:.6 }
    .a   { stroke:#3d8bf0; stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .adash{stroke:#3d8bf0; stroke-width:3; fill:none; stroke-dasharray:10 8; stroke-linecap:round }
    .gf  { fill:#8892a0; opacity:.20 }
    .gf2 { fill:#8892a0; opacity:.38 }
    .af  { fill:#3d8bf0; opacity:.26 }
    .af2 { fill:#3d8bf0; opacity:.85 }
    .wf  { fill:#d98b6a; opacity:.30 }
    .w   { stroke:#d98b6a; stroke-width:3; fill:none; stroke-linecap:round }
    .t   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#8892a0 }
    .ta  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#3d8bf0 }
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#8892a0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#3d8bf0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  </defs>

  <text class="t" x="70" y="90">FIXED WINDOW</text>

  <!-- events, sliced by a regular grid that ignores their boundaries -->
  <g>
    <rect class="gf2" x="70" y="130" width="230" height="60" rx="10"/>
    <rect class="gf2" x="320" y="130" width="330" height="60" rx="10"/>
    <rect class="gf2" x="670" y="130" width="190" height="60" rx="10"/>
    <rect class="gf2" x="880" y="130" width="250" height="60" rx="10"/>
  </g>
  <g class="w">
    <path d="M335 112 L335 208"/>
    <path d="M600 112 L600 208"/>
    <path d="M865 112 L865 208"/>
  </g>
  <text class="t" x="70" y="252" style="fill:#d98b6a">EVENTS SPLIT</text>

  <!-- same stream, cut on event boundaries -->
  <text class="ta" x="70" y="420">SEMANTIC UNIT</text>

  <g>
    <rect class="af" x="70" y="460" width="230" height="60" rx="10"/>
    <rect class="af" x="320" y="460" width="330" height="60" rx="10"/>
    <rect class="af" x="670" y="460" width="190" height="60" rx="10"/>
    <rect class="af" x="880" y="460" width="250" height="60" rx="10"/>
    <rect class="a" x="70" y="460" width="230" height="60" rx="10"/>
    <rect class="a" x="320" y="460" width="330" height="60" rx="10"/>
    <rect class="a" x="670" y="460" width="190" height="60" rx="10"/>
    <rect class="a" x="880" y="460" width="250" height="60" rx="10"/>
  </g>
  <g class="adash">
    <path d="M310 442 L310 538"/>
    <path d="M660 442 L660 538"/>
    <path d="M870 442 L870 538"/>
  </g>
  <text class="ta" x="70" y="582">EVENTS INTACT</text>

  <!-- retrieval improves -->
  <path class="a" d="M70 650 L1130 650" marker-end="url(#ara)"/>
  <text class="t" x="70" y="712">LONG-HORIZON RETRIEVAL</text>
</svg>
