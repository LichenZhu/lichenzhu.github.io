<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750"
     role="img" aria-label="Frames of a long video scored against the query; only the few highest-scoring keyframes are kept within the token budget">
  <defs>
<style>
    .s   { stroke:#8892a0; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .s2  { stroke:#8892a0; stroke-width:2; fill:none; stroke-linecap:round; opacity:.55 }
    .dash{ stroke:#8892a0; stroke-width:2.5; fill:none; stroke-dasharray:9 9; stroke-linecap:round; opacity:.6 }
    .a   { stroke:#3d8bf0; stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round }
    .adash{stroke:#3d8bf0; stroke-width:3; fill:none; stroke-dasharray:10 8; stroke-linecap:round }
    .gf  { fill:#8892a0; opacity:.20 }
    .gf2 { fill:#8892a0; opacity:.38 }
    .af  { fill:#3d8bf0; opacity:.26 }
    .af2 { fill:#3d8bf0; opacity:.85 }
    .wf  { fill:#d98b6a; opacity:.30 }
    .w   { stroke:#d98b6a; stroke-width:3; fill:none; stroke-linecap:round }
    .t   { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#8892a0 }
    .ta  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:30px;
           letter-spacing:.10em; fill:#3d8bf0 }
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#8892a0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="#3d8bf0" stroke-width="2" stroke-linecap="round"/>
  </marker>
  </defs>

  <rect class="s" x="70" y="70" width="700" height="66" rx="12"/>
  <text class="t" x="98" y="112">QUERY</text>
  <rect class="gf" x="240" y="93" width="300" height="16" rx="8"/>
  <rect class="gf" x="560" y="93" width="170" height="16" rx="8"/>
  <path class="a" d="M800 103 L1050 103" marker-end="url(#ara)"/>
  <text class="ta" x="820" y="80">SCORE</text>

  <text class="t" x="70" y="212">FRAMES</text>

  <!-- frame strip: 16 frames, four of them selected -->
  <g>
    <rect class="gf" x="70"  y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="136" y="240" width="52" height="76" rx="6"/>
    <rect class="af" x="202" y="240" width="52" height="76" rx="6"/><rect class="a" x="202" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="268" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="334" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="400" y="240" width="52" height="76" rx="6"/>
    <rect class="af" x="466" y="240" width="52" height="76" rx="6"/><rect class="a" x="466" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="532" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="598" y="240" width="52" height="76" rx="6"/>
    <rect class="af" x="664" y="240" width="52" height="76" rx="6"/><rect class="a" x="664" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="730" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="796" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="862" y="240" width="52" height="76" rx="6"/>
    <rect class="af" x="928" y="240" width="52" height="76" rx="6"/><rect class="a" x="928" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="994" y="240" width="52" height="76" rx="6"/>
    <rect class="gf" x="1060" y="240" width="52" height="76" rx="6"/>
  </g>

  <!-- per-frame relevance, with the budget cut -->
  <g>
    <rect class="gf2" x="70"  y="470" width="52" height="28" rx="4"/>
    <rect class="gf2" x="136" y="452" width="52" height="46" rx="4"/>
    <rect class="af2" x="202" y="384" width="52" height="114" rx="4"/>
    <rect class="gf2" x="268" y="466" width="52" height="32" rx="4"/>
    <rect class="gf2" x="334" y="444" width="52" height="54" rx="4"/>
    <rect class="gf2" x="400" y="474" width="52" height="24" rx="4"/>
    <rect class="af2" x="466" y="370" width="52" height="128" rx="4"/>
    <rect class="gf2" x="532" y="460" width="52" height="38" rx="4"/>
    <rect class="gf2" x="598" y="448" width="52" height="50" rx="4"/>
    <rect class="af2" x="664" y="396" width="52" height="102" rx="4"/>
    <rect class="gf2" x="730" y="470" width="52" height="28" rx="4"/>
    <rect class="gf2" x="796" y="456" width="52" height="42" rx="4"/>
    <rect class="gf2" x="862" y="476" width="52" height="22" rx="4"/>
    <rect class="af2" x="928" y="378" width="52" height="120" rx="4"/>
    <rect class="gf2" x="994" y="464" width="52" height="34" rx="4"/>
    <rect class="gf2" x="1060" y="472" width="52" height="26" rx="4"/>
  </g>
  <path class="s2" d="M70 498 L1130 498"/>

  <path class="adash" d="M60 424 L1140 424"/>
  <text class="ta" x="70" y="580">TOKEN BUDGET</text>

  <!-- what survives -->
  <text class="t" x="70" y="672">KEPT</text>
  <g>
    <rect class="a" x="230" y="626" width="70" height="66" rx="8"/>
    <rect class="a" x="320" y="626" width="70" height="66" rx="8"/>
    <rect class="a" x="410" y="626" width="70" height="66" rx="8"/>
    <rect class="a" x="500" y="626" width="70" height="66" rx="8"/>
    <rect class="af" x="230" y="626" width="70" height="66" rx="8"/>
    <rect class="af" x="320" y="626" width="70" height="66" rx="8"/>
    <rect class="af" x="410" y="626" width="70" height="66" rx="8"/>
    <rect class="af" x="500" y="626" width="70" height="66" rx="8"/>
  </g>
  <text class="t" x="610" y="672">OF 16</text>
</svg>
